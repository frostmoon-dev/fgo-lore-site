<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shiru's Garden</title>
<meta name="description" content="Write your own characters and talk to them through any OpenAI-compatible API or proxy.">
<meta name="theme-color" content="#f4f1ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151413" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script src="js/theme-init.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="#/">Shiru’s Garden</a>
    <nav class="main-nav" aria-label="Main">
      <ul>
        <li><a href="#/" data-nav="home">Bots</a></li>
        <li><a href="#/personas" data-nav="personas">Personas</a></li>
        <li><a href="#/prompt" data-nav="prompt">Prompt</a></li>
        <li><a href="#/lore" data-nav="lore">Lore</a></li>
        <li><a href="#/connection" data-nav="connection">Connection</a></li>
        <li><a href="#/settings" data-nav="settings">Settings</a></li>
      </ul>
    </nav>
    <a class="header-status" id="status" href="#/connection">
      <span class="status-dot" aria-hidden="true"></span>
      <span class="label">Checking</span>
    </a>
    <button class="icon-toggle theme-toggle" type="button" id="theme-toggle" aria-label="Switch to dark theme">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<main id="main" tabindex="-1"></main>

<footer class="site-footer">
  <div class="wrap">
    <span>Your bots, chats and keys stay in this browser.</span>
    <a href="#/settings">Back up your data</a>
  </div>
</footer>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
